[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brewbridge"
version = "0.1.1"
description = "Sync brew.is in-stock ingredients into BeerSmith 4, import recipes, and fill the /uppskriftir Recipe Machine in one click."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hjalti Leifsson" }]
requires-python = ">=3.10"
keywords = ["homebrew", "beersmith", "brew.is", "uppskriftir", "iceland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Other/Nonlisted Topic",
]
dependencies = [
    "playwright>=1.40",
    "pystray>=0.19",
    "pillow>=10",          # tray icon image
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.5",
]
build = [
    "pyinstaller>=6",
]

[project.urls]
Homepage = "https://github.com/Homeblest/brewbridge"
Issues = "https://github.com/Homeblest/brewbridge/issues"

[project.scripts]
brewbridge = "brewbridge.__main__:main"

[project.gui-scripts]
brewbridge-tray = "brewbridge.tray:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brewbridge = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
